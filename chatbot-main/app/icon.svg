<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#0369A1"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5EEAD4;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#5EEAD4"/>
      <stop offset="70%" style="stop-color:#BAE6FD"/>
      <stop offset="100%" style="stop-color:#BAE6FD;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="96" height="96" rx="20" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none"
        stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Medical cross — vertical bar -->
  <rect x="41" y="18" width="18" height="54" rx="5" fill="white"/>
  <!-- Medical cross — horizontal bar -->
  <rect x="18" y="41" width="54" height="18" rx="5" fill="white"/>

  <!-- EKG pulse line across bottom of cross (decorative) -->
  <polyline
    points="18,72 26,72 29,65 33,80 37,58 41,72 59,72 63,65 67,80 71,58 74,72 82,72"
    fill="none" stroke="url(#pulse)" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Corner accent dots (neural nodes) -->
  <circle cx="18" cy="50" r="3" fill="#5EEAD4" opacity="0.7"/>
  <circle cx="82" cy="50" r="3" fill="#5EEAD4" opacity="0.7"/>
  <circle cx="50" cy="18" r="3" fill="#5EEAD4" opacity="0.7"/>
</svg>
