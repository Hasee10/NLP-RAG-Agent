<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040D21"/>
      <stop offset="55%" stop-color="#0B2558"/>
      <stop offset="100%" stop-color="#0C6080"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ekgL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="40%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="ekgR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Subtle top-left inner highlight -->
  <rect width="100" height="100" rx="22" fill="none"
        stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- Center radial glow -->
  <ellipse cx="50" cy="50" rx="34" ry="34" fill="url(#centerGlow)"/>

  <!-- Cross — vertical bar (slim, elegant) -->
  <rect x="42" y="13" width="16" height="74" rx="5" fill="white" opacity="0.97"/>
  <!-- Cross — horizontal bar -->
  <rect x="13" y="42" width="74" height="16" rx="5" fill="white" opacity="0.97"/>

  <!-- EKG left arm: flat → QRS spike → flat, stays within left arm (x 13→42) -->
  <polyline points="13,50 22,50 25,41 28,59 31,50 42,50"
    fill="none" stroke="url(#ekgL)" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- EKG right arm: flat → QRS spike → flat, stays within right arm (x 58→87) -->
  <polyline points="58,50 69,50 72,41 75,59 78,50 87,50"
    fill="none" stroke="url(#ekgR)" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neural nodes: top + bottom (cyan — medical vitality) -->
  <circle cx="50" cy="13" r="4" fill="#22D3EE"/>
  <circle cx="50" cy="87" r="4" fill="#22D3EE"/>

  <!-- Neural nodes: left + right (violet — AGI/intelligence) -->
  <circle cx="13" cy="50" r="4" fill="#818CF8"/>
  <circle cx="87" cy="50" r="4" fill="#818CF8"/>

  <!-- Inner ring node at center cross — subtle AI core -->
  <circle cx="50" cy="50" r="4.5" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.5"/>
</svg>
